/**:
  teleop_joint_impedance_controller:
    ros__parameters:
      arm_id: "fr3"
      joint_command_topic: "/teleop_joint_commands"
      gripper_command_topic: "/teleop_gripper_command"
      command_timeout: 0.5      # seconds before warning about stale commands
      max_joint_distance: 0.5   # max rad jump allowed per command (safety)
      gripper_threshold: 0.02   # below this width (m) = close gripper
      k_gains:
        - 200.0
        - 200.0
        - 200.0
        - 200.0
        - 100.0
        - 100.0
        - 50.0
      d_gains:
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 10.0
        - 10.0
        - 5.0

/**:
  trajectory_waypoint_joint_impedance_controller:
    ros__parameters:
      arm_id: "fr3"
      gazebo: false
      trajectory_topic: "/arm_joint_trajectory"
      finish_topic: "/trajectory_finished"
      start_topic: "/recording_start"
      waypoint_duration: 4.0  # seconds to reach each waypoint
      waypoint_tolerance: 0.01  # rad tolerance to consider waypoint reached
      k_gains:
        - 200.0
        - 200.0
        - 200.0
        - 200.0
        - 100.0
        - 100.0
        - 100.0
      d_gains:
        - 10.0
        - 10.0
        - 10.0
        - 10.0
        - 10.0
        - 10.0
        - 5.0

/**:
  dexhand_joint_impedance_controller:
    ros__parameters:
      arm_id: "fr3"
      joint_command_topic: "/teleop_joint_commands"
      command_timeout: 0.5      # seconds before warning about stale commands
      max_joint_distance: 0.5   # max rad jump allowed per command (safety)
      k_gains:
        - 200.0
        - 200.0
        - 200.0
        - 200.0
        - 100.0
        - 100.0
        - 50.0
      d_gains:
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 10.0
        - 10.0
        - 5.0

/**:
  teach_replay_controller:
    ros__parameters:
      arm_id: "fr3"
      mode_topic: "/teach_replay/mode"
      trajectory_topic: "/teach_replay/trajectory"
      start_topic: "/teach_replay/replay_started"
      finish_topic: "/teach_replay/replay_finished"
      # When entering REPLAY, first run a min-jerk move from the current pose
      # to trajectory[0] before tracking. Set to false to skip and snap.
      move_to_start: true
      move_to_start_min_duration: 4.0   # seconds, lower bound on pre-roll duration
      move_to_start_max_velocity: 0.2   # rad/s, peak per-joint velocity cap
                                        # (drives duration when far from start)
      k_gains:
        - 200.0
        - 200.0
        - 200.0
        - 200.0
        - 100.0
        - 100.0
        - 50.0
      d_gains:
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 10.0
        - 10.0
        - 5.0
