controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_position_example_controller:
      type: franka_example_controllers/JointPositionExampleController

    joint_velocity_example_controller:
      type: franka_example_controllers/JointVelocityExampleController

    joint_impedance_example_controller:
      type: franka_example_controllers/JointImpedanceExampleController

    cartesian_pose_example_controller:
      type: franka_example_controllers/CartesianPoseExampleController

    trajectory_following_joint_impedance_controller:
      type: franka_example_controllers/TrajectoryFollowingJointImpedanceController

    trajectory_subscriber_joint_impedance_controller:
      type: franka_example_controllers/TrajectorySubscriberJointImpedanceController

    trajectory_waypoint_joint_impedance_controller:
      type: franka_example_controllers/TrajectoryWaypointJointImpedanceController

    teleop_joint_impedance_controller:
      type: franka_example_controllers/TeleopJointImpedanceController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

cartesian_pose_example_controller:
  ros__parameters:
    gazebo: true

joint_position_example_controller:
  ros__parameters:
    gazebo: true

joint_velocity_example_controller:
  ros__parameters:
    gazebo: true
  
joint_impedance_example_controller:
  ros__parameters:
    k_gains:
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 10.0
      - 6.0
      - 2.0
    d_gains:
      - 2.0
      - 2.0
      - 2.0
      - 1.0
      - 1.0
      - 1.0
      - 0.5

trajectory_following_joint_impedance_controller:
  ros__parameters:
    gazebo: true
    trajectory_file: "/home/robot/franka_ros2_ws/src/franka_example_controllers/scripts/output.trajectory"
    trajectory_rate: 10.0  # Hz
    approach_duration: 4.0  # seconds to reach first waypoint (increased for slower approach)
    k_gains:
      - 200.0
      - 200.0
      - 200.0
      - 200.0
      - 100.0
      - 100.0
      - 100.0
    d_gains:
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 5.0
    # k_gains:
    #   - 24.0
    #   - 24.0
    #   - 24.0
    #   - 24.0
    #   - 10.0
    #   - 6.0
    #   - 2.0
    # d_gains:
    #   - 2.0
    #   - 2.0
    #   - 2.0
    #   - 1.0
    #   - 1.0
    #   - 1.0
    #   - 0.5

trajectory_subscriber_joint_impedance_controller:
  ros__parameters:
    gazebo: true
    trajectory_topic: "arm_joint_trajectory"
    approach_duration: 4.0  # seconds to reach first waypoint
    trajectory_timeout: 1.0  # seconds before considering trajectory stale
    max_joint_distance: 0.5  # Maximum joint distance (rad) before using safe smooth approach
    safe_approach_duration: 4.0  # Duration for smooth approach when distance threshold exceeded
    k_gains:
      - 200.0
      - 200.0
      - 200.0
      - 200.0
      - 100.0
      - 100.0
      - 100.0
    d_gains:
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 5.0

/**:
  trajectory_waypoint_joint_impedance_controller:
    ros__parameters:
      arm_id: "fr3"
      gazebo: true
      trajectory_topic: "/arm_joint_trajectory"
      finish_topic: "/trajectory_finished"
      start_topic: "/recording_start"
      waypoint_duration: 4.0  # seconds to reach each waypoint
      waypoint_tolerance: 0.05  # rad tolerance to consider waypoint reached
      k_gains:
        - 200.0
        - 200.0
        - 200.0
        - 200.0
        - 100.0
        - 100.0
        - 100.0
      d_gains:
        - 10.0
        - 10.0
        - 10.0
        - 10.0
        - 10.0
        - 10.0
        - 5.0

teleop_joint_impedance_controller:
  ros__parameters:
    arm_id: "fr3"
    gazebo: true
    joint_command_topic: "/teleop_joint_commands"
    gripper_command_topic: "/teleop_gripper_command"
    command_timeout: 0.5
    max_joint_distance: 0.5
    gripper_threshold: 0.02
    k_gains:
      - 200.0
      - 200.0
      - 200.0
      - 200.0
      - 100.0
      - 100.0
      - 50.0
    d_gains:
      - 20.0
      - 20.0
      - 20.0
      - 20.0
      - 10.0
      - 10.0
      - 5.0

  